[package]
name = "classic-screen-reader"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
minerva-core = { path = "../vendor/minerva/crates/minerva-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
strip = true
panic = "abort"
